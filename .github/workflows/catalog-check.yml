name: Catalog progress check
on:
  push:
    branches: ['codex/teaching-audit']
    paths: ['assets/catalog.js', 'index.html', '_checks/catalog-progress.cjs', '.github/workflows/catalog-check.yml']
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /_checks/
            /assets/*.js
            /assets/*.css
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/course-server.log 2>&1 &
      - run: node _checks/catalog-progress.cjs
