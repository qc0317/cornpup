name: Teaching experience check
on:
  push:
    branches: [main, 'codex/teaching-*']
    paths: ['preview/**', 'lessons/**', 'assets/teaching*', 'assets/interactive*', 'assets/challenges.js', '_checks/**', '.github/workflows/teaching-check.yml']
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /preview/
            /_checks/
            /lessons/
            /assets/*.js
            /assets/*.css
            /assets/*.svg
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/course-server.log 2>&1 &
      - run: node _checks/teaching.cjs
      - run: node _checks/teaching.cjs
        env:
          COURSE_PATH: lessons
      - run: node _checks/teaching-next.cjs
      - run: node _checks/teaching-next.cjs
        env:
          COURSE_PATH: lessons
      - run: node _checks/teaching-11-15.cjs
        env:
          COURSE_PATH: lessons
      - run: node _checks/teaching-16-20.cjs
        env:
          COURSE_PATH: lessons
      - run: node _checks/teaching-21-25.cjs
        env:
          COURSE_PATH: lessons
      - run: node _checks/teaching-26-30.cjs
        env:
          COURSE_PATH: lessons
      - run: node _checks/teaching-31-35.cjs
        env:
          COURSE_PATH: lessons
      - run: node _checks/teaching-36-40.cjs
        env:
          COURSE_PATH: lessons
      - run: node _checks/teaching-41-45.cjs
        env:
          COURSE_PATH: lessons
      - run: node _checks/teaching-46-50.cjs
        env:
          COURSE_PATH: lessons
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: teaching-check-results
          path: teaching-check-results/
