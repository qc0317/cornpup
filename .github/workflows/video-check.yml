name: Video playback check
on:
  push:
    branches: [main]
    paths:
      - assets/courses.js
      - .github/workflows/video-check.yml
      - _checks/video.cjs
      - _checks/video-batch.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node _checks/video.cjs
        env:
          CHECK_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: video-check-results
          path: _checks/video-results.json
